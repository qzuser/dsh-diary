# ============================================================================
# dsh-diary —— DSH bundle patch
# ============================================================================
# 挂载声明：DSH 启动时把本插件插进 profile 的配置树。
#
# 安装（本地源码目录）：
#   dsh plugin --profile desktop add "link:C:\Users\<你>\.dsh\plugins\dsh-diary"
# 或已在 profile 的 dsh.profile.bundles 里列出时自动加载。
#
# ⚠️ `name:` 必须与安装后的**包名**一致（dsh-diary），否则表现为
#    「装上了但设置页 404」。
# 设置页在：DSH 设置 → 日记
# ============================================================================

- insert:
    - id: dsh-diary
      name: dsh-diary
